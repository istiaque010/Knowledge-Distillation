# Phase 4: the student. Same tokenizer, vocabulary (8,192) and context (256) as the teacher, smaller Transformer.
# Teacher: 6 layers / 6 heads / 384 wide (13.9M parameters).
# Training settings match the teacher's (configs/small.yaml in Project 1) except max_steps (3,000 instead of
# 10,000) and warmup (150 = 5% of the run, as the teacher's 500 was 5% of 10,000).
run_name: student
seed: 1337
data:
  data_dir: ../project1/data/full          # same 1,772,187 stories, same val/test split as the teacher
  tokenizer: ../project1/teacher/tokenizer.json
model:
  n_layer: 4
  n_head: 4
  n_embd: 256
  block_size: 256
  dropout: 0.1
  bias: true
train:
  device: auto
  precision: fp32
  batch_size: 8
  grad_accum_steps: 8     # effective batch = 64 sequences = 16,384 tokens per step (same as the teacher)
  max_steps: 3000         # ~49M tokens
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 150
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  eval_interval: 250
  eval_batches: 100
  log_interval: 25
  ckpt_interval: 1000
  num_workers: 0
